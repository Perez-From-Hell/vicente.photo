name: Deploy to GitHub Pages

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # Se ejecuta al abrir/actualizar una PR (para validar que compila) o cuando la PR se mergea en main
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        if: github.event.action != 'closed'
        uses: actions/checkout@v4

      - name: Checkout main for deployment
        if: github.event.action == 'closed' && github.event.pull_request.merged == true
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install, build, and upload site
        uses: withastro/action@v3

  deploy:
    needs: build
    # Solo despliega a producción cuando la PR ha sido formalmente mergeada en main
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
