name: Deploy to GitHub Pages

on:
  # Se ejecuta únicamente cuando una Pull Request hacia 'main' se cierra (mergeada)
  pull_request:
    types: [closed]
    branches:
      - main

  # Permite también ejecutar el despliegue manualmente si alguna vez lo necesitas
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # Solo ejecuta si fue una PR mergeada exitosamente o si se ejecutó manualmente
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install, build, and upload site
        uses: withastro/action@v3

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
